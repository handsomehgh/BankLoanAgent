name: prepayment_evaluation_skill
version: "1.0.0"
description: "提前还款综合评估：计算节省利息、违约金，对比缩短期限与减少月供两种方案"
capability_tags: ["提前还款", "贷后管理"]
sop_description: "本技能将依次：1）检索违约金规则 2）试算提前还款的节省利息和违约金，对比缩短期限和减少月供两种方案"
tags: ["AfterLoan"]
baseline: false

input_schema:
  - name: remaining_principal
    type: float
    description: "剩余本金（元）"
    required: true
    validation:
      ge: 0.01
  - name: annual_rate
    type: float
    description: "年利率（%）"
    required: true
    validation:
      ge: 0.01
      le: 50
  - name: total_months
    type: integer
    description: "贷款总期数（月）"
    required: true
    validation:
      ge: 1
      le: 600
  - name: paid_months
    type: integer
    description: "已还期数（月）"
    required: true
    validation:
      ge: 0
      le: 600
  - name: prepay_amount
    type: float
    description: "提前还款金额（元），0 或留空表示全部结清"
    required: false
    default: 0
    validation:
      ge: 0
  - name: method
    type: string
    description: "还款方式：等额本息或等额本金"
    required: false
    default: "等额本息"
  - name: penalty_rate_override
    type: float
    description: "手动指定违约金比例（如 0.01 表示 1%），不填则按银行规则自动计算"
    required: false
    default: null
    validation:
      ge: 0
      le: 0.05

steps:
  - name: general_search_knowledge
    tool: general_search_knowledge
    args:
      query: "提前还款违约金规则 满一年免收 不满一年收取比例"
      source_type:
        value: '["process_guide", "regulation"]'
        type: json
      top_k:
        value: "3"
        type: integer
    output_key: policy_knowledge
    optional: true
    on_failure: skip

  - name: calculate_prepayment
    tool: calculate_prepayment
    args:
      remaining_principal:
        value: "{{ input.remaining_principal }}"
        type: float
      annual_rate:
        value: "{{ input.annual_rate }}"
        type: float
      total_months:
        value: "{{ input.total_months }}"
        type: integer
      paid_months:
        value: "{{ input.paid_months }}"
        type: integer
      prepay_amount:
        value: "{{ input.prepay_amount }}"
        type: float
      method:
        value: "{{ input.method }}"
        type: string
      penalty_rate_override:
        value: "{{ input.penalty_rate_override }}"
        type: float
      option:
        value: "compare"
        type: string
    output_key: prepayment_result

output_template: |
  ## 提前还款综合评估

  {% if policy_knowledge %}
  **违约金政策参考**：{{ policy_knowledge.documents[:300] if policy_knowledge.documents else "未找到相关政策" }}
  {% endif %}

  ### 方案对比
  | 项目 | 缩短期限 | 减少月供 |
  |------|----------|----------|
  | 剩余本金 | {{ prepayment_result.compare.shorten_term.new_principal }} 元 | {{ prepayment_result.compare.reduce_payment.new_principal }} 元 |
  | 新月供 | {{ prepayment_result.compare.shorten_term.new_monthly_payment }} 元 | {{ prepayment_result.compare.reduce_payment.new_monthly_payment }} 元 |
  | 节省利息 | {{ prepayment_result.compare.shorten_term.saved_interest }} 元 | {{ prepayment_result.compare.reduce_payment.saved_interest }} 元 |
  | 净节省 | {{ prepayment_result.compare.shorten_term.net_saving }} 元 | {{ prepayment_result.compare.reduce_payment.net_saving }} 元 |

  **违约金**：{{ prepayment_result.penalty }} 元（比例：{{ prepayment_result.penalty_rate_used * 100 }}%）

  {{ prepayment_result.disclaimer }}