name: apply_home_loan_skill
version: "1.0.0"
description: "住房贷款综合咨询（利率查询、额度试算、月供计算、资格预审）"
capability_tags: ["住房贷款", "贷款咨询"]
sop_description: "本技能将依次：1）检索住房贷款产品信息 2）查询最新利率 3）计算最高可贷额度 4）试算月供 5）进行资格预审（可选）"
tags: ["LoanAdvisor"]
baseline: false

input_schema:
  - name: monthly_income
    type: float
    description: "月收入（元）"
    required: true
    validation:
      gt: 0
  - name: existing_debt
    type: float
    description: "现有月债务（元）"
    required: false
    default: 0
    validation:
      ge: 0
  - name: loan_amount
    type: float
    description: "期望贷款金额（万元）"
    required: true
    validation:
      gt: 0
  - name: term_years
    type: integer
    description: "贷款期限（年）"
    required: true
    validation:
      ge: 1
      le: 50
  - name: is_first_house
    type: boolean
    description: "是否首套房"
    required: false
    default: true
  - name: repayment_method
    type: string
    description: "还款方式：等额本息或等额本金"
    required: false
    default: "等额本息"

  # 用于资格预审的用户画像信息（LLM 从系统提供的画像摘要中提取）
  - name: age
    type: integer
    description: "年龄（岁），可从用户画像中提取"
    required: false
  - name: occupation
    type: string
    description: "职业，可从用户画像中提取"
    required: false
  - name: credit_history
    type: string
    description: "征信简况（如良好、有逾期记录等），可从用户画像中提取"
    required: false
  - name: loan_purpose
    type: string
    description: "贷款用途描述（如购房、装修等），可从对话上下文中推断"
    required: false
  - name: has_real_estate
    type: boolean
    description: "名下是否有房产，可从用户画像中提取"
    required: false
  - name: work_years
    type: integer
    description: "当前工作年限（年），可从用户画像中提取"
    required: false

steps:
  - name: general_search_knowledge
    tool: general_search_knowledge
    args:
      query: "住房贷款产品介绍、利率政策、申请条件、还款方式"
      source_type:
        value: '["product_manual", "faq"]'
        type: json
      product_type:
        value: "住房贷款"
        type: string
      top_k:
        value: "3"
        type: integer
    output_key: knowledge
    optional: true
    on_failure: skip

  - name: query_interest_rate
    tool: query_interest_rate
    args:
      product_type:
        value: "住房贷款"
        type: string
      term_years:
        value: "{{ input.term_years }}"
        type: integer
      is_first_house:
        value: "{{ input.is_first_house }}"
        type: boolean
    output_key: rate_result

  - name: calculate_max_loan_amount
    tool: calculate_max_loan_amount
    args:
      monthly_income:
        value: "{{ input.monthly_income }}"
        type: float
      existing_monthly_debt:
        value: "{{ input.existing_debt }}"
        type: float
      annual_rate:
        value: "{{ rate_result.lpr_value }}"
        type: float
      term_years:
        value: "{{ input.term_years }}"
        type: integer
      method:
        value: "{{ input.repayment_method }}"
        type: string
    output_key: max_loan_result

  - name: calculate_monthly_payment
    tool: calculate_monthly_payment
    args:
      principal:
        value: "{{ input.loan_amount * 10000 }}"
        type: float
      annual_rate:
        value: "{{ rate_result.lpr_value }}"
        type: float
      term_years:
        value: "{{ input.term_years }}"
        type: integer
      method:
        value: "{{ input.repayment_method }}"
        type: string
    output_key: monthly_result

  - name: check_loan_eligibility
    tool: check_loan_eligibility
    args:
      loan_type:
        value: "住房贷款"
        type: string
      desired_amount:
        value: "{{ input.loan_amount * 10000 }}"
        type: float
      term_years:
        value: "{{ input.term_years }}"
        type: integer
      monthly_income:
        value: "{{ input.monthly_income }}"
        type: float
      existing_monthly_debt:
        value: "{{ input.existing_debt }}"
        type: float
      age:
        value: "{{ input.age }}"
        type: integer
      occupation:
        value: "{{ input.occupation }}"
        type: string
      credit_history:
        value: "{{ input.credit_history }}"
        type: string
      loan_purpose:
        value: "{{ input.loan_purpose }}"
        type: string
      has_real_estate:
        value: "{{ input.has_real_estate }}"
        type: boolean
      work_years:
        value: "{{ input.work_years }}"
        type: integer
    output_key: eligibility_result
    optional: true
    on_failure: skip

output_template: |
  ## 🏠 住房贷款实时评估结果
  {% if knowledge and knowledge.documents %}
  **政策参考**：{{ knowledge.documents[:200] }}
  {% endif %}

  **当前 LPR**：{{ rate_result.lpr }}，参考利率区间 {{ rate_result.min_rate }} - {{ rate_result.max_rate }}
  {{ rate_result.notes }}

  ### 额度试算
  根据您的收入，最高可贷约 **{{ max_loan_result.max_amount }} 元**（每月还款上限 {{ max_loan_result.max_monthly_payment }} 元）

  ### 月供试算
  贷款 **{{ input.loan_amount * 10000 }} 元**，期限 **{{ input.term_years }} 年**，还款方式 **{{ input.repayment_method }}**
  - 月供：**{{ monthly_result.monthly_payment }} 元**
  - 总利息：{{ monthly_result.total_interest }} 元

  {% if eligibility_result %}
  ### 资格预审
  {% if eligibility_result.eligible %}
  初步预审通过 ✅
  {% else %}
  预审未通过 ❌，原因：{{ eligibility_result.failed_rules | map(attribute='rule_name') | join('、') }}
  建议：{{ eligibility_result.suggestions | join('；') }}
  {% endif %}
  {% if eligibility_result.skipped_rules %}
  ⚠️ **因缺少以下信息，部分预审规则未执行**：{{ eligibility_result.skipped_rules | map(attribute='rule_name') | join('、') }}
  您可以补充 {{ eligibility_result.skipped_rules | map(attribute='rule_name') | join('、') }} 等信息，我会为您重新评估。
  {% endif %}
  {% endif %}

  {{ rate_result.disclaimer }}